<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vertex AI Glowing Turquoise Gradient -->
    <linearGradient id="vertex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Pi Agent Deep Purple/Indigo Gradient -->
    <linearGradient id="pi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Coral/Pink Gradient for connection links -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Glow Filter for background accents -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg-grad)" />

  <!-- Ambient Background Light/Nebula Effects -->
  <circle cx="200" cy="150" r="150" fill="#0891b2" opacity="0.15" filter="url(#soft-glow)" />
  <circle cx="1000" cy="350" r="200" fill="#7c3aed" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="600" cy="250" r="100" fill="#22d3ee" opacity="0.08" filter="url(#soft-glow)" />

  <!-- Technical Grid Pattern Background overlay -->
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500 M 800,0 L 800,500 M 900,0 L 900,500 M 1000,0 L 1000,500 M 1100,0 L 1100,500" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Abstract Tech Line Connections (AI Agent Theme) -->
  <g opacity="0.25" stroke-linecap="round">
    <line x1="150" y1="120" x2="350" y2="80" stroke="url(#accent-grad)" stroke-width="1.5" />
    <line x1="350" y1="80" x2="500" y2="180" stroke="url(#accent-grad)" stroke-width="2" />
    <line x1="500" y1="180" x2="450" y2="350" stroke="url(#accent-grad)" stroke-width="1.5" />
    <line x1="450" y1="350" x2="200" y2="380" stroke="url(#accent-grad)" stroke-width="2" />
    <line x1="200" y1="380" x2="150" y2="120" stroke="url(#accent-grad)" stroke-width="1.5" />
    
    <!-- Connection Nodes (Dots) -->
    <circle cx="150" cy="120" r="4" fill="#22d3ee" />
    <circle cx="350" cy="80" r="5" fill="#c084fc" filter="url(#glow)" />
    <circle cx="500" cy="180" r="4" fill="#818cf8" />
    <circle cx="450" cy="350" r="6" fill="#22d3ee" filter="url(#glow)" />
    <circle cx="200" cy="380" r="4" fill="#c084fc" />
  </g>

  <g opacity="0.15" stroke-linecap="round">
    <line x1="1050" y1="100" x2="850" y2="140" stroke="url(#accent-grad)" stroke-dasharray="5,5" stroke-width="1.5" />
    <line x1="850" y1="140" x2="720" y2="300" stroke="url(#accent-grad)" stroke-width="1.5" />
    <line x1="720" y1="300" x2="900" y2="400" stroke="url(#accent-grad)" stroke-dasharray="10,5" stroke-width="2" />
    <circle cx="1050" cy="100" r="5" fill="#818cf8" />
    <circle cx="850" cy="140" r="3" fill="#22d3ee" />
    <circle cx="720" cy="300" r="5" fill="#c084fc" filter="url(#glow)" />
    <circle cx="900" cy="400" r="4" fill="#22d3ee" />
  </g>

  <!-- ILLUSTRATION: The Core Integration (Pi Agent + Google Vertex AI) -->
  <g transform="translate(600, 180)">
    <!-- Vertex AI Diamond Symbol -->
    <g transform="translate(60, 0)">
      <polygon points="0,-75 65,0 0,75 -65,0" fill="url(#vertex-grad)" opacity="0.85" filter="url(#glow)" />
      <polygon points="0,-50 43,0 0,50 -43,0" fill="#0f172a" />
      <polygon points="0,-35 30,0 0,35 -30,0" fill="url(#vertex-grad)" />
      <!-- Star Accent in Vertex -->
      <path d="M-5,-5 Q0,-25 5,-5 Q25,0 5,5 Q0,25 -5,5 Q-25,0 -5,-5 Z" fill="#ffffff" transform="scale(0.5)" filter="url(#glow)" />
    </g>

    <!-- Pi Symbol Graphic (Left side) -->
    <g transform="translate(-80, 0)">
      <!-- Hexagonal Shield Back -->
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="url(#pi-grad)" opacity="0.85" filter="url(#glow)" />
      <polygon points="0,-62 53,-31 53,31 0,62 -53,31 -53,-31" fill="#0f172a" />
      
      <!-- Styled White Pi (π) Symbol inside -->
      <g transform="translate(-25, -30) scale(1.3)" fill="#ffffff" filter="url(#glow)">
        <!-- Horizontal Bar -->
        <path d="M 5,12 C 10,10 32,10 37,12 C 40,13 42,10 38,8 C 30,5 12,5 4,8 C 1,9 1,13 5,12 Z" />
        <!-- Left Leg -->
        <path d="M 12,11 C 12,18 11,32 8,38 C 7,40 11,42 12,39 C 15,33 16,18 16,11 Z" />
        <!-- Right Leg -->
        <path d="M 28,11 C 28,18 28,32 30,36 C 31,38 33,39 35,38 C 37,37 36,34 34,31 C 32,27 32,18 32,11 Z" />
      </g>
    </g>

    <!-- Dynamic Linking Beam with Arrows/Nodes -->
    <g stroke="url(#accent-grad)" stroke-width="4" filter="url(#glow)">
      <line x1="-15" y1="0" x2="10" y2="0" />
      <polygon points="-15,6 -25,0 -15,-6" fill="#c084fc" />
      <polygon points="10,6 20,0 10,-6" fill="#22d3ee" />
    </g>
    <!-- Central Node -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#22d3ee" />
  </g>

  <!-- Typography & Text -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="2">
      PI VERTEX AI PROVIDER
    </text>

    <!-- Subtitle / Description -->
    <text x="600" y="410" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="1">
      Enterprise Google Cloud ADC Credentials for Pi Coding Agent
    </text>

    <!-- Badges / Labels -->
    <g transform="translate(600, 450)">
      <!-- Badge 1: Gemini 3.5 Ready -->
      <g transform="translate(-160, 0)">
        <rect x="-90" y="-15" width="180" height="30" rx="15" fill="#1e293b" stroke="#0891b2" stroke-width="1.5" />
        <text y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#22d3ee" letter-spacing="0.5">GEMINI 3.5 FLASH</text>
      </g>
      
      <!-- Badge 2: Google Cloud ADC -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
        <text y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#a5b4fc" letter-spacing="0.5">GCLOUD ADC</text>
      </g>

      <!-- Badge 3: Pi Package -->
      <g transform="translate(150, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
        <text y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#e9d5ff" letter-spacing="0.5">PI PACKAGE</text>
      </g>
    </g>
  </g>
</svg>
